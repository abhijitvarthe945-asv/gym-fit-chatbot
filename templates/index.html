<!DOCTYPE html>
<html>
<head>
    <title>FitZone Gym Assistant</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #F3F4F2;
            color: #1F2421;
            margin: 0;
            padding: 48px 20px;
            display: flex;
            justify-content: center;
        }
        .wrap { width: 100%; max-width: 560px; }
        header { margin-bottom: 24px; }
        h1 {
            font-family: 'Barlow Condensed', sans-serif;
            font-weight: 700;
            font-size: 36px;
            letter-spacing: 0.5px;
            margin: 0 0 4px 0;
            text-transform: uppercase;
        }
        .tagline { font-size: 14px; color: #5C6B64; margin: 0; }
        #chatbox {
            background: #FFFFFF;
            border: 1px solid #DCE2DF;
            border-radius: 14px;
            height: 380px;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .msg { max-width: 80%; padding: 10px 14px; border-radius: 12px; font-size: 15px; line-height: 1.5; }
        .user { align-self: flex-end; background: #1F8A70; color: #FFFFFF; border-bottom-right-radius: 4px; }
        .bot { align-self: flex-start; background: #DCEEE7; color: #1F2421; border-bottom-left-radius: 4px; }
        .quick-replies {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin: 14px 0;
        }
        .chip {
            padding: 8px 14px;
            border-radius: 999px;
            border: 1px solid #1F8A70;
            background: #FFFFFF;
            color: #1F8A70;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
        }
        .chip:hover { background: #1F8A70; color: #FFFFFF; }
        .input-row { display: flex; gap: 8px; margin-top: 12px; }
        #userInput {
            flex: 1;
            padding: 12px 16px;
            border-radius: 999px;
            border: 1px solid #DCE2DF;
            background: #FFFFFF;
            font-family: 'Inter', sans-serif;
            font-size: 15px;
            color: #1F2421;
            outline: none;
        }
        #userInput:focus { border-color: #1F8A70; }
        button.send {
            padding: 12px 22px;
            border-radius: 999px;
            border: none;
            background: #1F8A70;
            color: #FFFFFF;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
        }
        button.send:hover { background: #17755D; }
    </style>
</head>
<body>
    <div class="wrap">
        <header>
            <h1>FitZone Gym</h1>
            <p class="tagline">Ask about memberships, classes, or hours</p>
        </header>
        <div id="chatbox"></div>
        <div class="quick-replies">
            <div class="chip" onclick="quickSend('What are your membership prices?')">Membership prices</div>
            <div class="chip" onclick="quickSend('What classes do you offer?')">Classes</div>
            <div class="chip" onclick="quickSend('What are your hours?')">Hours</div>
        </div>
        <div class="input-row">
            <input type="text" id="userInput" placeholder="Ask something...">
            <button class="send" onclick="sendMessage()">Send</button>
        </div>
    </div>

    <script>
        function addMessage(text, cls) {
            const chatbox = document.getElementById("chatbox");
            const div = document.createElement("div");
            div.className = "msg " + cls;
            div.textContent = text;
            chatbox.appendChild(div);
            chatbox.scrollTop = chatbox.scrollHeight;
        }

        async function sendMessage() {
            const input = document.getElementById("userInput");
            const message = input.value;
            if (!message) return;
            addMessage(message, "user");
            input.value = "";
            const response = await fetch("/chat", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ message: message })
            });
            const data = await response.json();
            addMessage(data.reply, "bot");
        }

        function quickSend(text) {
            document.getElementById("userInput").value = text;
            sendMessage();
        }

        document.getElementById("userInput").addEventListener("keydown", function(e) {
            if (e.key === "Enter") sendMessage();
        });
    </script>
</body>
</html>
